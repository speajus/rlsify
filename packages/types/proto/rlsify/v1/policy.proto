syntax = "proto3";

package rlsify.v1;

import "google/protobuf/struct.proto";

// SQL command types for RLS policies
enum PolicyCommand {
  POLICY_COMMAND_UNSPECIFIED = 0;
  POLICY_COMMAND_SELECT = 1;
  POLICY_COMMAND_INSERT = 2;
  POLICY_COMMAND_UPDATE = 3;
  POLICY_COMMAND_DELETE = 4;
  POLICY_COMMAND_ALL = 5;
}

// Join types
enum JoinType {
  JOIN_TYPE_UNSPECIFIED = 0;
  JOIN_TYPE_INNER = 1;
  JOIN_TYPE_LEFT = 2;
  JOIN_TYPE_RIGHT = 3;
  JOIN_TYPE_FULL = 4;
}

// Generated SQL statement type
enum StatementType {
  STATEMENT_TYPE_UNSPECIFIED = 0;
  STATEMENT_TYPE_CREATE_POLICY = 1;
  STATEMENT_TYPE_ALTER_TABLE = 2;
  STATEMENT_TYPE_DROP_POLICY = 3;
  STATEMENT_TYPE_ENABLE_RLS = 4;
  STATEMENT_TYPE_DISABLE_RLS = 5;
}

// Individual RLS policy definition
message PolicyDefinition {
  string name = 1;
  PolicyCommand command = 2;
  // Legacy string-based expressions
  optional string using = 3;
  optional string with_check = 4;
  // JSON-based expressions (as Struct for flexibility)
  optional google.protobuf.Struct using_expression = 5;
  optional google.protobuf.Struct with_check_expression = 6;
  repeated string roles = 7;
  bool permissive = 8;
}

// Join definition for multi-table policies
message JoinDefinition {
  string table = 1;
  JoinType type = 2;
  optional string on = 3;
  optional string alias = 4;
}

// Complete RLS policy configuration for a table
message RLSPolicyConfig {
  string version = 1;
  string table = 2;
  optional string schema = 3;
  repeated PolicyDefinition policies = 4;
  repeated JoinDefinition joins = 5;
  bool enable_rls = 6;
  bool force_rls = 7;
}

// Validation error
message ValidationError {
  string field = 1;
  string message = 2;
  string code = 3;
}

// Validation result
message ValidationResult {
  bool valid = 1;
  repeated ValidationError errors = 2;
  repeated ValidationError warnings = 3;
}

// Generated SQL statement
message GeneratedSQL {
  string sql = 1;
  StatementType type = 2;
  optional string description = 3;
}

// Policy generation result
message PolicyGenerationResult {
  repeated GeneratedSQL statements = 1;
  ValidationResult validation = 2;
  RLSPolicyConfig config = 3;
}

// Request to preview policies (generate SQL without applying)
message PreviewPoliciesRequest {
  RLSPolicyConfig config = 1;
}

// Response with SQL preview
message PreviewPoliciesResponse {
  repeated GeneratedSQL statements = 1;
}

// Request to validate configuration
message ValidateConfigRequest {
  RLSPolicyConfig config = 1;
}

// Response with validation result
message ValidateConfigResponse {
  ValidationResult result = 1;
}

// Request to apply policies to database
message ApplyPoliciesRequest {
  RLSPolicyConfig config = 1;
  // Whether to run as a dry run (validate only)
  bool dry_run = 2;
}

// Response from applying policies
message ApplyPoliciesResponse {
  PolicyGenerationResult result = 1;
  bool applied = 2;
  optional string error = 3;
}

// Saved policy with metadata
message SavedPolicy {
  string id = 1;
  RLSPolicyConfig config = 2;
  string created_at = 3;
  string updated_at = 4;
  optional string description = 5;
}

// Request to save a policy configuration
message SavePolicyRequest {
  RLSPolicyConfig config = 1;
  optional string id = 2;  // If provided, updates existing
  optional string description = 3;
}

// Response from saving a policy
message SavePolicyResponse {
  SavedPolicy policy = 1;
}

// Request to list saved policies
message ListPoliciesRequest {
  optional string table_filter = 1;  // Filter by table name
  int32 limit = 2;
  int32 offset = 3;
}

// Response with list of saved policies
message ListPoliciesResponse {
  repeated SavedPolicy policies = 1;
  int32 total = 2;
}

// Request to get a specific policy
message GetPolicyRequest {
  string id = 1;
}

// Response with a single policy
message GetPolicyResponse {
  SavedPolicy policy = 1;
}

// Request to delete a policy
message DeletePolicyRequest {
  string id = 1;
}

// Response from deleting a policy
message DeletePolicyResponse {
  bool deleted = 1;
}

// Existing RLS policy from the database (from pg_policies view)
message ExistingRLSPolicy {
  string schema_name = 1;
  string table_name = 2;
  string policy_name = 3;
  string command = 4;  // SELECT, INSERT, UPDATE, DELETE, ALL
  bool permissive = 5;
  repeated string roles = 6;
  optional string using_expression = 7;      // Raw SQL USING clause
  optional string with_check_expression = 8; // Raw SQL WITH CHECK clause
  // Parsed JSON expressions (if parsing succeeded)
  optional google.protobuf.Struct parsed_using = 9;
  optional google.protobuf.Struct parsed_with_check = 10;
  optional string parse_error = 11;  // Error message if parsing failed
}

// Request to list existing RLS policies from the database
message ListExistingPoliciesRequest {
  optional string schema = 1;  // Filter by schema (defaults to 'public')
  optional string table = 2;   // Filter by table name
}

// Response with existing RLS policies
message ListExistingPoliciesResponse {
  repeated ExistingRLSPolicy policies = 1;
}

// Session context for policy testing
message SessionContext {
  // User ID (auth.uid() value)
  string user_id = 1;
  // PostgreSQL role name
  string role = 2;
  // JWT claims as JSON string
  string claims_json = 3;
}

// Result of evaluating a single policy expression
message ExpressionResult {
  // Whether the expression allowed the operation
  bool allowed = 1;
  // Human-readable reason/error
  optional string reason = 2;
  // The generated SQL expression that was evaluated
  optional string sql_expression = 3;
}

// Result of testing a single policy
message PolicyTestResult {
  // Policy name
  string policy_name = 1;
  // USING expression result (for SELECT/UPDATE/DELETE)
  ExpressionResult using_result = 2;
  // WITH CHECK expression result (for INSERT/UPDATE)
  ExpressionResult with_check_result = 3;
  // Overall allowed based on operation
  bool overall_allowed = 4;
}

// Request to test policies against sample data
message TestPoliciesRequest {
  // The table to test (schema.table format)
  string table = 1;
  // Policies to test
  repeated PolicyDefinition policies = 2;
  // Session context (role, user ID, claims)
  SessionContext session = 3;
  // Sample row data as JSON string
  string row_data_json = 4;
  // Operation being tested (SELECT, INSERT, UPDATE, DELETE)
  PolicyCommand operation = 5;
}

// Response with policy test results
message TestPoliciesResponse {
  // Results for each policy
  repeated PolicyTestResult results = 1;
  // Any error that occurred during testing
  optional string error = 2;
}

// A saved test case for policy testing
message SavedTestCase {
  // Unique identifier
  string id = 1;
  // Human-readable name
  string name = 2;
  // PostgreSQL role to test as
  string role = 3;
  // User ID for auth.uid()
  string user_id = 4;
  // JWT claims as JSON string
  string claims = 5;
  // Sample row data as JSON string
  string row_data = 6;
  // Operation to test
  PolicyCommand operation = 7;
  // Expected outcome
  string expected_outcome = 8;  // 'allow' or 'deny'
}

// Request to save test cases for a table
message SaveTestCasesRequest {
  // Table identifier (schema.table format)
  string table = 1;
  // Test cases to save
  repeated SavedTestCase test_cases = 2;
}

// Response after saving test cases
message SaveTestCasesResponse {
  // Whether the save was successful
  bool success = 1;
}

// Request to get test cases for a table
message GetTestCasesRequest {
  // Table identifier (schema.table format)
  string table = 1;
}

// Response with test cases for a table
message GetTestCasesResponse {
  // Test cases for the table
  repeated SavedTestCase test_cases = 1;
}

// Request to list all tables that have test cases
message ListTestCaseTablesRequest {}

// Response with tables that have test cases
message ListTestCaseTablesResponse {
  // Map of table name to test case count
  map<string, int32> tables = 1;
}

// Request to generate a policy expression using AI
message GeneratePolicyRequest {
  // Auggie API token
  string api_key = 1;
  // Natural language prompt describing the policy
  string prompt = 2;
  // Table name
  string table_name = 3;
  // Optional table schema information (as JSON)
  optional google.protobuf.Struct table_schema = 4;
  // Optional existing policies for context
  repeated string existing_policies = 5;
  // Optional model name (e.g., "sonnet4.5")
  optional string model = 6;
  // Optional API URL (tenant URL from auggie token print)
  optional string api_url = 7;
}

// Response with generated policy expression
message GeneratePolicyResponse {
  // Generated permission expression (as JSON)
  google.protobuf.Struct expression = 1;
  // AI explanation of the policy
  string explanation = 2;
}

// Request to generate test cases for a policy using AI
message GenerateTestsRequest {
  // Auggie API token
  string api_key = 1;
  // Natural language prompt describing test scenarios
  string prompt = 2;
  // Table name
  string table_name = 3;
  // Policy name
  string policy_name = 4;
  // Optional policy expression for context (as JSON)
  optional google.protobuf.Struct policy_expression = 5;
  // Optional table schema information (as JSON)
  optional google.protobuf.Struct table_schema = 6;
  // Optional model name
  optional string model = 7;
}

// A single generated test case
message GeneratedTestCase {
  // Test name
  string test_name = 1;
  // Test description
  optional string description = 2;
  // User ID for test context
  string user_id = 3;
  // Optional user role
  optional string role = 4;
  // Optional JWT claims (as JSON)
  optional google.protobuf.Struct claims = 5;
  // SQL operation to test
  PolicyCommand operation = 6;
  // Expected result
  string expected_result = 7; // "allowed" or "denied"
  // Optional test data (as JSON)
  optional google.protobuf.Struct test_data = 8;
}

// Response with generated test cases
message GenerateTestsResponse {
  // Generated test cases
  repeated GeneratedTestCase tests = 1;
}

// Request to generate a complete policy definition using AI
message GenerateFullPolicyRequest {
  // Auggie API token
  string api_key = 1;
  // Natural language prompt describing the policy
  string prompt = 2;
  // Table name
  string table_name = 3;
  // Optional table schema (as JSON)
  optional google.protobuf.Struct table_schema = 4;
  // Optional list of existing policy names to avoid duplicates
  repeated string existing_policies = 5;
  // Optional AI model to use
  optional string model = 6;
  // Optional API URL (tenant URL from auggie token print)
  optional string api_url = 7;
}

// A generated policy definition
message GeneratedPolicyDefinition {
  // Policy name (e.g., users_select_own)
  string name = 1;
  // SQL commands this policy applies to
  repeated string command = 2;
  // Human-readable description
  string description = 3;
  // PostgreSQL roles (e.g., authenticated, public)
  repeated string roles = 4;
  // USING expression (as JSON)
  google.protobuf.Struct using_expression = 5;
  // WITH CHECK expression (as JSON, optional)
  optional google.protobuf.Struct with_check_expression = 6;
}

// Response with generated complete policy definition(s)
message GenerateFullPolicyResponse {
  // Generated policy definitions (may be multiple if CRUD was requested)
  repeated GeneratedPolicyDefinition policies = 1;
  // AI explanation of the generated policies
  string explanation = 2;
}

// Policy management service
service PolicyService {
  // Generate SQL preview from configuration
  rpc PreviewPolicies(PreviewPoliciesRequest) returns (PreviewPoliciesResponse);

  // Validate policy configuration
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);

  // Apply policies to database
  rpc ApplyPolicies(ApplyPoliciesRequest) returns (ApplyPoliciesResponse);

  // Save a policy configuration
  rpc SavePolicy(SavePolicyRequest) returns (SavePolicyResponse);

  // List saved policies
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);

  // Get a specific policy
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);

  // Delete a policy
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);

  // List existing RLS policies from the database
  rpc ListExistingPolicies(ListExistingPoliciesRequest) returns (ListExistingPoliciesResponse);

  // Test policies against sample data using PostgreSQL evaluation
  rpc TestPolicies(TestPoliciesRequest) returns (TestPoliciesResponse);

  // Save test cases for a table
  rpc SaveTestCases(SaveTestCasesRequest) returns (SaveTestCasesResponse);

  // Get test cases for a table
  rpc GetTestCases(GetTestCasesRequest) returns (GetTestCasesResponse);

  // List all tables that have test cases
  rpc ListTestCaseTables(ListTestCaseTablesRequest) returns (ListTestCaseTablesResponse);

  // Generate a policy expression using AI
  rpc GeneratePolicy(GeneratePolicyRequest) returns (GeneratePolicyResponse);

  // Generate test cases for a policy using AI
  rpc GenerateTests(GenerateTestsRequest) returns (GenerateTestsResponse);

  // Generate a complete policy definition using AI
  rpc GenerateFullPolicy(GenerateFullPolicyRequest) returns (GenerateFullPolicyResponse);
}

