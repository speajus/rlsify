syntax = "proto3";

package rlsify.v1;

// Column information from database introspection
message ColumnInfo {
  string name = 1;
  string type = 2;
  bool nullable = 3;
  optional string default_value = 4;
  bool is_primary_key = 5;
  bool is_foreign_key = 6;
}

// Foreign key relationship
message ForeignKeyRelation {
  string source_table = 1;
  string source_column = 2;
  string target_table = 3;
  string target_column = 4;
  optional string constraint_name = 5;
}

// Table information from database introspection
message TableInfo {
  string schema = 1;
  string name = 2;
  repeated ColumnInfo columns = 3;
  repeated ForeignKeyRelation foreign_keys = 4;
  repeated string primary_keys = 5;
}

// Complete schema information
message SchemaInfo {
  repeated TableInfo tables = 1;
  repeated ForeignKeyRelation foreign_keys = 2;
}

// Request to get schema information
message GetSchemaRequest {
  // Optional schema name (defaults to 'public')
  optional string schema = 1;
}

// Response with schema information
message GetSchemaResponse {
  SchemaInfo schema = 1;
}

// Request to get table details
message GetTableRequest {
  string table_name = 1;
  // Optional schema name (defaults to 'public')
  optional string schema = 2;
}

// Response with table details
message GetTableResponse {
  TableInfo table = 1;
}

// Request to get foreign keys for a table
message GetForeignKeysRequest {
  string table_name = 1;
  optional string schema = 2;
}

// Response with foreign keys
message GetForeignKeysResponse {
  repeated ForeignKeyRelation foreign_keys = 1;
}

// Request to get table data (rows)
message GetTableDataRequest {
  string table_name = 1;
  optional string schema = 2;
  optional int32 limit = 3; // Default 10
  optional int32 offset = 4; // Default 0
  optional string filter_column = 5; // Optional column to filter
  optional string filter_value = 6; // Optional value to filter by
}

// A single row of table data
message TableRow {
  // Map of column name to JSON-encoded value
  map<string, string> values = 1;
}

// Response with table data
message GetTableDataResponse {
  repeated TableRow rows = 1;
  int32 total_count = 2;
}

// Schema introspection service
service SchemaService {
  // Get database schema information
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);

  // Get details for a specific table
  rpc GetTable(GetTableRequest) returns (GetTableResponse);

  // Get foreign key relationships for a table
  rpc GetForeignKeys(GetForeignKeysRequest) returns (GetForeignKeysResponse);

  // Get table data (rows) with optional filtering
  rpc GetTableData(GetTableDataRequest) returns (GetTableDataResponse);
}

